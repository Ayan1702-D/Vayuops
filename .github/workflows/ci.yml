name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            backend/pyproject.toml
            ml/pyproject.toml
      - name: Install backend and ML
        run: python -m pip install -e './backend[dev]' -e './ml[dev]'
      - name: Lint Python source
        run: python -m ruff check backend ml --extend-exclude '*.ipynb'
      - name: Test backend and ML
        run: python -m pytest backend/tests ml/tests
      - name: Build backend image
        run: docker build --tag vayuops-backend:ci backend
